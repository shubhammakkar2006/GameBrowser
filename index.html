<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Info App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>Game Info App</h1>
            <p>Search games, filter by platform, and sort them by popularity using the RAWG API.</p>
        </section>

        <section class="panel">
            <div class="controls">
                <label class="field">
                    <span>Search</span>
                    <input type="text" id="search-input" placeholder="Search games by name">
                </label>

                <label class="field">
                    <span>Platform</span>
                    <select id="platform-filter">
                        <option value="">All Platforms</option>
                        <option value="4">PC</option>
                        <option value="18">PlayStation 4</option>
                        <option value="1">Xbox One</option>
                        <option value="7">Nintendo Switch</option>
                        <option value="3">iOS</option>
                        <option value="21">Android</option>
                    </select>
                </label>

                <label class="field">
                    <span>Sort</span>
                    <select id="sort-filter">
                        <option value="-rating">Popularity</option>
                        <option value="name">Name A-Z</option>
                        <option value="-released">Newest</option>
                    </select>
                </label>
            </div>
        </section>

        <section class="panel">
            <div class="status-bar">
                <p id="status-message">Search for games using the filters below.</p>
                <p id="results-count"></p>
            </div>
            <div id="games-container" class="games-grid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
